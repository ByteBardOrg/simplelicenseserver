services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple_license_server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple_license_server"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Local development only. Bound to localhost: Docker-published ports bypass host firewalls like ufw.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    restart: unless-stopped
    develop:
      watch:
        - path: ./cmd
          action: rebuild
        - path: ./internal
          action: rebuild
        - path: ./ui
          action: rebuild
          ignore:
            - ui/node_modules/
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simple_license_server?sslmode=disable
      MANAGEMENT_API_KEYS: management_key_dev_123456
      # The keys in this file are published in the docs. The server refuses them unless this is set,
      # which is only acceptable for a local development stack bound to 127.0.0.1 like this one.
      ALLOW_EXAMPLE_SECRETS: "true"
      UI_ENABLED: "true"
      REQUEST_TIMEOUT: 15s
      SHUTDOWN_TIMEOUT: 10s
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 30s
      HTTP_IDLE_TIMEOUT: 60s
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_GLOBAL_RPS: "0"
      RATE_LIMIT_PER_IP_RPS: "20"
      RATE_LIMIT_PER_IP_BURST: "40"
      RATE_LIMIT_IP_TTL: 10m
      RATE_LIMIT_MAX_IP_ENTRIES: "10000"
      # Behind a proxy, name the header it sets with the real client IP, e.g. CF-Connecting-IP.
      CLIENT_IP_HEADER: ""
      AUTH_FAILURE_MAX_ATTEMPTS: "10"
      AUTH_FAILURE_WINDOW: 15m
      OFFLINE_SIGNING_ENCRYPTION_KEY: development_offline_signing_key_123456
      OFFLINE_TOKEN_ISSUER: simple-license-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
